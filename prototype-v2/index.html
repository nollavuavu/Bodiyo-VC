<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Lift</title><!-- app.js sets "{screen} · {app}" (common.docTitle) once loaded -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <main id="screen" class="screen" tabindex="-1"><p class="loading" data-i18n="app.loading">Loading…</p></main>
    <div id="minibar" class="minibar" hidden></div>
    <div id="restbar" class="restbar" hidden></div>
    <nav id="tabbar" class="tabbar" aria-label="Sections" data-i18n-aria="nav.sectionsLabel" hidden>
      <a href="#/home" data-tab="home"><svg class="ic" data-icon="house" aria-hidden="true"></svg><span data-i18n="nav.today">Today</span></a>
      <a href="#/plan" data-tab="plan"><svg class="ic" data-icon="layers" aria-hidden="true"></svg><span data-i18n="nav.plan">Plan</span></a>
      <a href="#/train" data-tab="train"><svg class="ic" data-icon="dumbbell" aria-hidden="true"></svg><span data-i18n="nav.workout">Workout</span></a>
      <a href="#/week" data-tab="week"><svg class="ic" data-icon="calendar-days" aria-hidden="true"></svg><span data-i18n="nav.week">Week</span></a>
      <a href="#/library" data-tab="library"><svg class="ic" data-icon="book-open" aria-hidden="true"></svg><span data-i18n="nav.library">Library</span></a>
    </nav>
    <div id="scrim" class="scrim" hidden></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
    <div id="dialog" class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <!-- i18n.js is GENERATED from ../i18n/en.json + vi.json (tools/build-i18n.js); i18n-runtime.js provides window.I18N. -->
  <script src="i18n.js"></script>
  <script src="i18n-runtime.js"></script>
  <!-- evidence.js is GENERATED from evidence.json (tools/build-evidence.js). icons.js is GENERATED from lucide-static (tools/vendor-icons.js). -->
  <script src="evidence.js"></script>
  <script src="icons.js"></script>
  <script src="exercises.js"></script>
  <script src="data.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
