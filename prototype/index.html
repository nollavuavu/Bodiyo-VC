<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Carlsen – prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="device">
    <div class="phone" id="phone">
      <div class="statusbar"><span>9:41</span><span class="sb-icons">●●● ▲ ▮</span></div>
      <main id="screen" class="screen" aria-live="polite"></main>
      <nav id="tabbar" class="tabbar" hidden>
        <a href="#/home" data-tab="home"><span class="ti">⌂</span><span>Home</span></a>
        <a href="#/plan" data-tab="explore"><span class="ti">⌕</span><span>Explore</span></a>
        <a href="#/workout" data-tab="workout"><span class="ti">⊕</span><span>Workout</span></a>
        <a href="#/library" data-tab="library"><span class="ti">▥</span><span>Library</span></a>
        <a href="#/you" data-tab="you"><span class="ti">◯</span><span>You</span></a>
      </nav>
      <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
      <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
      <div id="toast" class="toast" hidden></div>
    </div>
    <p class="device-caption">Carlsen prototype · no backend · evidence: <span id="ev-status"></span></p>
  </div>
  <!-- Content is separate from UI: evidence.js is GENERATED from evidence.json -->
  <script src="evidence.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
